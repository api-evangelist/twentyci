note: >-
  The TwentyAPI entity graph, derived from path structure, path/query parameter vocabulary and the
  published response examples. TwentyCi declares NO components.schemas in anything it publishes - the
  harvested OpenAPI models response bodies as bare objects because TwentyCi documents them only as
  illustrative JSON. So the entities and relationships below are derived from identifiers and routes,
  not from named schemas, and no field-level type contract is asserted where TwentyCi publishes none.
  Nothing here is invented: every entity is reachable through a real documented operation, and every
  relationship is carried by a real documented parameter.

root_entity: Property
primary_key:
  field: uprn
  name: Unique Property Reference Number
  issuer: Ordnance Survey / GeoPlace
  type: integer/string (documented inconsistently as both across the corpus)
  note: >-
    UPRN is a UK national addressing key, not a vendor identifier and not a RESO Universal Property
    Identifier. It is the join key for the entire model.
id_prefixes: none
id_prefix_note: TwentyCi mints no prefixed object ids. Identifiers are external (UPRN, postcode) or opaque integers.

