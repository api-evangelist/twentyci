  description: A UK residential address in the DOMUS database, keyed by UPRN.
  identified_by: uprn
  operations: [property_information_by_uprn, property_details_by_uprn, get_properties]
  attributes_documented: [full address, postcode, coordinates, AVM price, AVM minimum, AVM maximum, confidence interval]
  filters: [bedrooms, bathrooms, property_type, energy_rating, floor_area_band, garage, driveway, ensuite, postcode]
- name: Category
  description: An attribute category - the vocabulary the Properties attribute endpoints are organised around.
  identified_by: category
  operations: [obtain_a_list_of_categories_for_a_property, obtain_a_specific_category_for_a_property]
  example_shape: '{"id":1,"type":"category","attributes":{"name":"Foo"}}'
- name: PropertyAttribute
  description: A property's values within a category (or across all categories).
  operations: [property_attributes, get_properties_property_category_category]
- name: Valuation
  description: Automated Valuation Model output for one property or one area - price plus min/max and confidence interval.
  operations: [valuation_of_property_by_uprn_avm, average_property_values_by_postcode]
  note: The AVM route is published by TwentyCi as /propertiesavm2/{property} - a missing slash in their own documentation, transcribed verbatim.
- name: Transaction
  description: A historical sale/transaction event on a property.
  operations: [obtain_all_transactions_for_property_via_uprn]
- name: Trigger
  description: A home-mover lifecycle event on a property - the transaction signal TwentyCi's business is built on.
  identified_by: trigger
  operations: [get_trigger_trigger, trigger_history, get_properties_by_trigger_type, get_no_uprn_properties_by_trigger_type]
  delivery: poll
  delivery_note: >-
    Despite the event language, triggers are POLLED through REST. There is no webhook, callback or
    subscription surface anywhere in TwentyAPI.
- name: TriggerType
  description: The classification of a trigger event.
  identified_by: typeId
  operations: [get_properties_by_trigger_type, get_no_uprn_properties_by_trigger_type]
- name: Brand
  description: An estate-agent or letting-agent brand, the unit of all Agent Performance analytics.
  identified_by: brand_id
  operations: [list_of_best_agents, brands_ranked_by_sstc_s, new_instructions_statistics_for_a_brand, sstc_statistics_for_a_brand]
- name: AgentPerformanceMetric
  description: >-
