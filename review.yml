conclusion: |
  Classified built. TwentyCi has a real, live, publicly readable developer portal and
  a real 57-operation REST API with a real OAuth 2.0 token endpoint - all of which was
  captured. What it does not have is reachability: the data plane is 401 to everyone
  without a commercially issued credential, and the specification it advertises as
  downloadable is a 404.

  For the sector question, TwentyCi is the clean UK counter-example. Where a US real
  estate provider might be RESO-certified but unreachable, TwentyCi is the inverse
  shape: no certification exists at all because no industry body mandates one in the
  UK, yet the provider still publishes better human documentation than many certified
  US systems - and still gates the data just as hard. Certification and reachability
  are independent axes, and the UK proves it from the other direction. The genuinely
  open layer in this market is public-sector (HM Land Registry Price Paid, Ordnance
  Survey / GeoPlace UPRN) and TwentyCi is a commercial enrichment tier sitting on top
  of it, keyed on the government's own identifier.
