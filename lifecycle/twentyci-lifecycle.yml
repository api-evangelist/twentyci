  TwentyCi publishes a versioned API but no lifecycle policy of any kind. Every field below was
  searched for in the full 66-node documentation corpus and on the corporate site; the negatives
  are recorded as findings rather than left blank. Because there is no status page and no
  deprecation policy, NO `StatusPage` and NO `Deprecation` pointers are wired in apis.yml.

