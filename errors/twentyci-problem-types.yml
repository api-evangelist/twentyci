  statuses_published_but_not_in_openapi: [400, 403, 406, 500, 502, 503, 504]
  error_code_registry: false
  error_code_registry_note: >-
    TwentyCi publishes no machine-readable error codes, no error identifiers and no per-error
    documentation URIs. Errors are distinguishable only by HTTP status plus a free-text message.
  gap: >-
    The harvested OpenAPI declares only the four statuses TwentyCi documents per endpoint
