  lifecycle: lifecycle/twentyci-lifecycle.yml
  authentication: authentication/twentyci-authentication.yml
  scopes: scopes/twentyci-scopes.yml
  examples: examples/twentyci-examples.yml
  vocabulary: vocabulary/twentyci-vocabulary.yml
  rate_limits: null
