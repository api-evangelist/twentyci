aid: twentyci
url: https://raw.githubusercontent.com/api-evangelist/twentyci/refs/heads/main/apis.yml
name: TwentyCi
kind: company
description: TwentyCi is a United Kingdom residential property data and home-mover
  intelligence company. It aggregates roughly 31.5 million UK addresses and tens of
  billions of data points from hundreds of primary sources into the DOMUS property
  database, and sells that data to estate agents, lenders, insurers, conveyancers,
  house builders, retailers and media agencies through the TwentyCi, TwentyEA and
  TwentyConvey brands. In the UK value chain it sits on the data-supply side rather
  than the listing side - there is no UK MLS, listings are controlled by the
  Rightmove and Zoopla portals, and TwentyCi is one of the private aggregators that
  resells transaction, valuation and home-mover signal on top of that closed market.
  Its API posture is honest but commercial - TwentyAPI is a genuine RESTful v2 API
  at https://api.twentyci.co.uk/api/v2 with a live, publicly readable documentation
  portal covering roughly 57 documented operations across properties, AVM valuation,
  transaction triggers, agent performance, address matching, schools, housing market
  metrics and retail propensity - but every endpoint returns 401 without a
  TwentyCi-issued OAuth 2.0 bearer token, there is no self-serve signup, no published
  pricing, and the specification download TwentyCi advertises at
  https://api.twentyci.co.uk/docs/v2/spec.json returns HTTP 404. Access is
  sales-led and partner-only. RESO is entirely absent - the UK has no MLS or RESO
  regime and TwentyCi identifies property by UPRN, the Ordnance Survey/GeoPlace
  Unique Property Reference Number, rather than by any RESO Universal Property
  Identifier.
